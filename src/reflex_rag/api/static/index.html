<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReflexRAG · 劳动法智能问答</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1d212e; --border: #2a2f3f;
    --text: #e6e8ef; --muted: #8b91a5; --accent: #5b8cff; --accent2: #3ddc97;
    --warn: #ffb86b; --err: #ff6b81; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 17px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12.5px; }
  main { flex: 1; display: flex; min-height: 0; }
  #chat { flex: 1.35; display: flex; flex-direction: column; border-right: 1px solid var(--border); min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .msg { max-width: 86%; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 14px 14px 4px 14px; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); padding: 14px 18px; border-radius: 14px 14px 14px 4px; }
  .msg.bot h4 { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
  .cite-chip { display: inline-block; background: var(--panel2); border: 1px solid var(--border); color: var(--accent2); font-size: 12px; padding: 1px 8px; border-radius: 10px; margin: 6px 6px 0 0; cursor: pointer; }
  .cite-chip:hover { border-color: var(--accent2); }
  .route-badge { font-size: 11.5px; padding: 1px 9px; border-radius: 10px; margin-left: 8px; vertical-align: 1px; }
  .route-simple { background: #1c2c4d; color: #7da4ff; } .route-multi_hop { background: #3a2c17; color: var(--warn); }
  .route-chitchat { background: #1d3328; color: var(--accent2); } .route-out_of_scope { background: #3d1f26; color: var(--err); }
  #inputbar { display: flex; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border); }
  #q { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 10px; font-size: 15px; outline: none; }
  #q:focus { border-color: var(--accent); }
  button { background: var(--accent); border: 0; color: #fff; padding: 0 22px; border-radius: 10px; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #side { flex: 1; overflow-y: auto; padding: 20px; background: #12141b; min-width: 320px; }
  #side h3 { font-size: 13.5px; color: var(--muted); font-weight: 600; margin-bottom: 14px; letter-spacing: .5px; }
  .stage { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; }
  .stage .head { display: flex; justify-content: space-between; font-size: 13px; }
  .stage .step { color: var(--accent); font-weight: 600; font-family: var(--mono); }
  .stage .ms { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .stage .body { font-size: 12.5px; color: var(--muted); margin-top: 4px; white-space: pre-wrap; }
  .stage .body b { color: var(--text); font-weight: 500; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 4px 0 14px; }
  .stats b { color: var(--text); font-family: var(--mono); font-weight: 600; }
  .evi { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .evi .t { color: var(--accent2); font-weight: 600; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 40px; }
  .hint code { background: var(--panel2); padding: 2px 8px; border-radius: 6px; font-family: var(--mono); font-size: 12px; }
  .caret::after { content: "▍"; color: var(--accent); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<header>
  <h1>Reflex<span>RAG</span></h1>
  <div class="sub">自适应反思式劳动法问答 · Agent 路由 / 迭代检索 / 引用自校验</div>
</header>
<main>
  <section id="chat">
    <div id="messages">
      <div class="hint">试试: <code>试用期最长多久?</code> <code>被违法辞退能主张哪些赔偿, 怎么算?</code> <code>公司拖欠工资怎么维权?</code></div>
    </div>
    <div id="inputbar">
      <input id="q" placeholder="输入劳动法问题, 回车发送…" autofocus>
      <button id="send">发送</button>
    </div>
  </section>
  <aside id="side">
    <h3>AGENT 思考过程</h3>
    <div id="stats" class="stats"></div>
    <div id="stages"></div>
    <h3 style="margin-top:18px">引用证据</h3>
    <div id="evidence"></div>
  </aside>
</main>
<script>
const $ = s => document.querySelector(s);
const ROUTE_CN = { simple: "单跳检索", multi_hop: "多跳分解", chitchat: "闲聊直答", out_of_scope: "礼貌拒答" };
let busy = false;

$("#q").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("#send").addEventListener("click", send);

async function send() {
  if (busy) return;
  const q = $("#q").value.trim();
  if (!q) return;
  $("#q").value = ""; busy = true; $("#send").disabled = true;
  addMsg("user", q);
  $("#stages").innerHTML = ""; $("#evidence").innerHTML = ""; $("#stats").innerHTML = "";

  const bot = addMsg("bot", "");
  const body = document.createElement("div");
  body.classList.add("caret");
  bot.appendChild(body);

  const resp = await fetch("/api/chat", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: q })
  });
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
      if (!line.startsWith("data: ")) continue;
      handle(JSON.parse(line.slice(6)), body);
    }
  }
  body.classList.remove("caret");
  busy = false; $("#send").disabled = false; $("#q").focus();
}

function handle(ev, body) {
  if (ev.type === "delta") { body.textContent += ev.text; scrollBottom(); }
  else if (ev.type === "stage") addStage(ev);
  else if (ev.type === "final") {
    renderFinal(ev, body);
  } else if (ev.type === "error") {
    body.textContent = "⚠ 出错: " + ev.message;
  }
}

function addStage(ev) {
  const div = document.createElement("div");
  div.className = "stage";
  const stepCN = { analyze: "① 路由分析", retrieve: "② 检索", sufficiency: "③ 充分性判定", generate: "④ 生成", verify: "⑤ 引用校验" };
  let detail = "";
  if (ev.step === "analyze") detail = `<b>${ROUTE_CN[ev.data.route] || ev.data.route}</b>  ${ev.data.reason || ""}` + (ev.data.sub_queries?.length ? `\n子查询: ${ev.data.sub_queries.join(" / ")}` : "");
  if (ev.step === "retrieve") detail = `第 ${ev.data.round} 轮 · 命中 <b>${ev.data.hits}</b> 块\n查询: ${ev.data.queries.join(" / ")}`;
  if (ev.step === "sufficiency") detail = ev.data.sufficient ? "证据充分 ✓" : `证据不足, 缺失: <b>${ev.data.missing_aspects.join("; ") || "未知"}</b>`;
  if (ev.step === "generate") detail = `输出 ${ev.data.chars || "-"} 字`;
  if (ev.step === "verify") detail = ev.data.verdict === "pass" ? "引用与忠实性校验通过 ✓" : `⚠ 问题: 越界引用 ${ev.data.unknown_citations?.join(",") || "-"} / 无据陈述 ${ev.data.unsupported_claims?.length || 0} 条`;
  div.innerHTML = `<div class="head"><span class="step">${stepCN[ev.step] || ev.step}</span><span class="ms">${ev.latency_ms} ms</span></div><div class="body">${detail}</div>`;
  $("#stages").appendChild(div);
}

function renderFinal(ev, body) {
  $("#stats").innerHTML = `
    <span>路由 <b>${ROUTE_CN[ev.route] || ev.route}</b></span>
    <span>检索轮次 <b>${ev.rounds || 0}</b></span>
    <span>引用 <b>${ev.citations.length}</b></span>
    <span>耗时 <b>${(ev.total_latency_ms / 1000).toFixed(1)}s</b></span>
    <span>tokens <b>${ev.usage.prompt_tokens}+${ev.usage.completion_tokens}</b></span>`;
  if (ev.citations.length) {
    const chips = document.createElement("div");
    chips.innerHTML = ev.citations.map(c =>
      `<span class="cite-chip" title="${c.title} ${c.chapter} ${c.articles.join("、")}">[${c.n}] ${c.title}${c.articles.length ? " " + c.articles.join("、") : ""}</span>`).join("");
    body.appendChild(chips);
  }
  $("#evidence").innerHTML = (ev.evidence_preview || []).map(e =>
    `<div class="evi"><span class="t">《${e.title}》</span> ${e.chapter} ${e.articles.join("、")}<br>${e.text}…</div>`).join("")
    || '<div class="evi">(无检索证据)</div>';
}

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (text) div.textContent = text;
  $("#messages").appendChild(div);
  scrollBottom();
  return div;
}
function scrollBottom() { $("#messages").scrollTop = $("#messages").scrollHeight; }
</script>
</body>
</html>
